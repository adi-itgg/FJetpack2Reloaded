name: Build Release Tag

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Test and build minified JAR
        run: ./gradlew test shadowJar proguard --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts-${{ github.ref_name }}
          path: |
            build/libs/*.jar
            build/mapping.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            build/libs/FJetpack2Reloaded-*-all.jar \
            build/libs/FJetpack2Reloaded-*-minified.jar \
            build/mapping.txt
