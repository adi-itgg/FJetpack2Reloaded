name: Java CI with Gradle

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Test and build
      run: ./gradlew test shadowJar --stacktrace

    - name: Upload test report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: build/reports/tests/test

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: build/libs/*.jar
        retention-days: 30
