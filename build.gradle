import proguard.gradle.ProGuardTask

buildscript {
    repositories {
        mavenCentral()
        google()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.3.1'
    }
}

plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group = 'me.phantomx.fjetpack.two.reloaded'
version = '2.0'

repositories {
    mavenCentral()
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven { url 'https://jitpack.io' }
    maven { url 'https://repo.bg-software.com/repository/api/' }
}

dependencies {

    implementation 'org.bstats:bstats-bukkit:3.0.0'

    compileOnly 'com.github.TechFortress:GriefPrevention:16.18'
    compileOnly 'com.bgsoftware:SuperiorSkyblockAPI:1.11.0'
    // ItemsAdder API: optional at runtime, provided by the ItemsAdder plugin when it is installed.
    compileOnly 'com.github.LoneDev6:api-itemsadder:3.6.1'

    compileOnly "org.apache.commons:commons-lang3:3.22.0"
    compileOnly 'org.jetbrains:annotations:20.1.0'

    //noinspection VulnerableLibrariesLocal
    compileOnly 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'

    // Dependency injection. The avaje generator MUST be declared before lombok (see AGENTS.md).
    def injectVersion = '12.3'
    implementation "io.avaje:avaje-inject:${injectVersion}"
    annotationProcessor "io.avaje:avaje-inject-generator:${injectVersion}"

    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // already a compileOnly dependency; needed at test runtime so YamlConfiguration/ConfigurationSection exist
    testImplementation 'org.spigotmc:spigot-api:26.3-R0.1-SNAPSHOT'
    // already a compileOnly dependency (Spigot bundles it); needed at test runtime for Messages
    testImplementation 'org.apache.commons::3.22.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'

    // The layer rules below are conventions until something fails the build when they break.
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // already compileOnly: the hook listeners must be loadable so reflection can see them
    testImplementation 'com.bgsoftware:SuperiorSkyblockAPI:1.11.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

def targetJavaVersion = 17
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release = targetJavaVersion
    }
}

jar {
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    } {
        exclude "META-INF/*.SF"
        exclude "META-INF/*.DSA"
        exclude "META-INF/*.RSA"
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}

ext.baseCoordinates = "${project.name}-${project.version}"

tasks.register('proguard', ProGuardTask) {
    configuration file('proguard.pro')

    //injars(tasks.named('jar', Jar).flatMap { it.archiveFile })
    injars(tasks.named('shadowJar', Jar).flatMap { it.archiveFile })

    // Automatically handle the Java version of this build.
    if (System.getProperty('java.version').startsWith('1.')) {
        // Before Java 9, the runtime classes were packaged in a single jar file.
        libraryjars "${System.getProperty('java.home')}/lib/rt.jar"
    } else {
        // As of Java 9, the runtime classes are packaged in modular jmod files.
        libraryjars "${System.getProperty('java.home')}/jmods/java.base.jmod", jarfilter: '!**.jar', filter: '!module-info.class'
        //libraryjars "${System.getProperty('java.home')}/jmods/....."
    }

    verbose

    outjars(layout.buildDirectory.file("libs/${baseCoordinates}-minified.jar"))
}

shadowJar {
    relocate 'org.bstats', 'me.phantomx.fjetpack.two.reloaded.fjetpack2reloaded.bstats'
}

tasks.register('copyJarToPlugins', Copy) {
    // Specify the output directory
    into "$projectDir/plugins"
    // Specify the source JAR file
    from jar.archiveFile
}

build.finalizedBy(copyJarToPlugins)